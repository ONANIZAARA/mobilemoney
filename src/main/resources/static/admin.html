<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Mobile Money</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #1e272e; color: #f5f6fa; margin: 0; padding: 20px; }
        .container { max-width: 1400px; margin: 0 auto; }
        h1 { text-align: center; color: #0fb9b1; margin-bottom: 30px; text-transform: uppercase; letter-spacing: 2px; }
        
        /* Stats Cards */
        .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 30px; }
        .stat-card { background: #2f3640; padding: 20px; border-radius: 8px; text-align: center; box-shadow: 0 4px 10px rgba(0,0,0,0.3); border-left: 5px solid #0fb9b1; }
        .stat-card h3 { margin: 0; color: #dcdde1; font-size: 0.9em; text-transform: uppercase; }
        .stat-card p { margin: 10px 0 0; font-size: 2em; font-weight: bold; color: #0fb9b1; }
        
        .tabs { display: flex; justify-content: center; margin-bottom: 20px; gap: 10px; }
        .tab { padding: 12px 25px; background: #2f3640; border: none; color: #f5f6fa; cursor: pointer; border-radius: 6px; font-weight: bold; font-size: 16px; }
        .tab.active { background: #0fb9b1; color: #1e272e; }
        .section { display: none; background: #2f3640; padding: 20px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
        .section.active { display: block; }
        
        .search-box { width: 100%; padding: 10px; margin-bottom: 15px; border-radius: 6px; border: none; background: #1e272e; color: white; font-size: 16px; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #57606f; }
        th { background: #1e272e; color: #0fb9b1; }
        tr:hover { background: #353b48; }
        .btn { padding: 6px 12px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; margin-right: 5px; }
        .btn-freeze { background: #e74c3c; color: white; }
        .btn-unfreeze { background: #2ecc71; color: white; }
        .status-active { color: #2ecc71; font-weight: bold; }
        .status-frozen { color: #e74c3c; font-weight: bold; }
        .back-link { display: block; text-align: center; margin-top: 30px; color: #0fb9b1; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h1>🛡️ Admin Control Panel</h1>
    
    <!-- Live Statistics -->
    <div class="stats-grid">
        <div class="stat-card">
            <h3>Total Wallets</h3>
            <p id="statWallets">0</p>
        </div>
        <div class="stat-card">
            <h3>Total System Balance</h3>
            <p id="statBalance">$0.00</p>
        </div>
        <div class="stat-card">
            <h3>Total Transactions</h3>
            <p id="statTxs">0</p>
        </div>
    </div>

    <div class="tabs">
        <button class="tab active" onclick="showSection('wallets')">All Wallets</button>
        <button class="tab" onclick="showSection('transactions')">All Transactions</button>
    </div>

    <!-- Wallets Section -->
    <div class="section active" id="walletsSection">
        <input type="text" class="search-box" id="walletSearch" placeholder="🔍 Search by Phone, Name, or Wallet ID..." onkeyup="filterTable('walletsTable', this.value)">
        <h2>Registered Wallets</h2>
        <table id="walletsTable">
            <thead>
                <tr>
                    <th>Wallet ID</th>
                    <th>User ID</th>
                    <th>Balance</th>
                    <th>Status</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>

    <!-- Transactions Section -->
    <div class="section" id="transactionsSection">
        <input type="text" class="search-box" id="txSearch" placeholder="🔍 Search by Transaction ID or Wallet ID..." onkeyup="filterTable('transactionsTable', this.value)">
        <h2>Transaction Audit Trail</h2>
        <table id="transactionsTable">
            <thead>
                <tr>
                    <th>Transaction ID</th>
                    <th>Wallet ID</th>
                    <th>Type</th>
                    <th>Amount</th>
                    <th>Fee</th>
                    <th>Status</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>

    <a href="dashboard.html" class="back-link">← Back to User Dashboard</a>
</div>

<script>
    const API_URL = "/api/admin"; 

    function showSection(section) {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
        
        if (section === 'wallets') {
            document.querySelector('.tab:first-child').classList.add('active');
            document.getElementById('walletsSection').classList.add('active');
            loadWallets();
        } else {
            document.querySelector('.tab:last-child').classList.add('active');
            document.getElementById('transactionsSection').classList.add('active');
            loadTransactions();
        }
    }

    async function loadWallets() {
        try {
            const response = await fetch(`${API_URL}/wallets`);
            const wallets = await response.json();
            const tbody = document.querySelector('#walletsTable tbody');
            tbody.innerHTML = '';
            
            let totalBalance = 0;

            wallets.forEach(w => {
                // Smart parsing to handle both camelCase and snake_case from backend
                const userId = w.userId || w.user_id || "N/A";
                const balance = parseFloat(w.balance || 0);
                totalBalance += balance;
                const status = w.status || "UNKNOWN";
                const statusClass = status === 'ACTIVE' ? 'status-active' : 'status-frozen';
                
                const actionBtn = status === 'ACTIVE' 
                    ? `<button class="btn btn-freeze" onclick="toggleStatus('${w.id}', 'freeze')">Freeze</button>`
                    : `<button class="btn btn-unfreeze" onclick="toggleStatus('${w.id}', 'unfreeze')">Unfreeze</button>`;

                tbody.innerHTML += `
                    <tr>
                        <td style="font-size: 0.85em;">${w.id}</td>
                        <td style="font-size: 0.85em;">${userId}</td>
                        <td>$${balance.toFixed(2)}</td>
                        <td class="${statusClass}">${status}</td>
                        <td>${actionBtn}</td>
                    </tr>
                `;
            });

            // Update Stats
            document.getElementById('statWallets').textContent = wallets.length;
            document.getElementById('statBalance').textContent = "$" + totalBalance.toFixed(2);
            
        } catch (err) {
            console.error("Failed to load wallets", err);
        }
    }

    async function loadTransactions() {
        try {
            const response = await fetch(`${API_URL}/transactions`);
            const txs = await response.json();
            const tbody = document.querySelector('#transactionsTable tbody');
            tbody.innerHTML = '';

            document.getElementById('statTxs').textContent = txs.length;

            txs.reverse().forEach(t => {
                const walletId = t.walletId || t.wallet_id || "N/A";
                tbody.innerHTML += `
                    <tr>
                        <td style="font-size: 0.85em;">${t.id}</td>
                        <td style="font-size: 0.85em;">${walletId}</td>
                        <td>${t.type}</td>
                        <td>$${parseFloat(t.amount).toFixed(2)}</td>
                        <td>$${parseFloat(t.fee).toFixed(2)}</td>
                        <td>${t.status}</td>
                    </tr>
                `;
            });
        } catch (err) {
            console.error("Failed to load transactions", err);
        }
    }

    async function toggleStatus(walletId, action) {
        if (!confirm(`Are you sure you want to ${action} this wallet?`)) return;
        
        try {
            const response = await fetch(`${API_URL}/wallet/${walletId}/${action}`, { method: 'POST' });
            if (response.ok) {
                alert(`Wallet ${action}d successfully!`);
                loadWallets(); 
            } else {
                alert('Failed to update wallet status.');
            }
        } catch (err) {
            alert('Error connecting to server.');
        }
    }

    // Search Functionality
    function filterTable(tableId, query) {
        const filter = query.toUpperCase();
        const table = document.getElementById(tableId);
        const tr = table.getElementsByTagName("tr");
        for (let i = 1; i < tr.length; i++) {
            let txtValue = tr[i].textContent || tr[i].innerText;
            if (txtValue.toUpperCase().indexOf(filter) > -1) {
                tr[i].style.display = "";
            } else {
                tr[i].style.display = "none";
            }
        }
    }

    // Load initial data
    loadWallets();
    loadTransactions();
</script>
</body>
</html>
